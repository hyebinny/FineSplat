model:
  class_name: src.model.model.TwoExpertModel
  dim1: 256
  dim2: 512
  dim3: 1024
  num_register_tokens: 4
  head_dim: 64
  inter_multi: 4
  qk_norm: true
  stage1_nlayer: 2
  stage2_nlayer: 4
  stage3_nlayer: 8
  group_size: 2
  patch_size: 4
  gaussians_per_patch: 4
  in_channels: 12
  gaussians:
    sh_degree: 1
    opacity_degree: 0
    near_plane: 0.01
    far_plane: 1000000.0
    scale_bias: -5.5137
    scale_max: -1.2
    opacity_bias: 4.0
    align_to_pixel: true
    max_dist: 500.0
  da_model_name: da3-giant
  da_model_weights_path: pretrained_weights/da3_giant.safetensors
  mvp_weights_path: pretrained_weights/mvp_patchwise_offset_dl3dv_lr_novdo.pt
refiner_model:
  e2e: true
  num_iters: 4
  refiner:
    patch_size: 8
  error:
    image_embed: mvp_s1
    stride: 4
data:
  data_path: src/data/dl3dv_train.txt
  input_frame_select_type: uniform
  target_frame_select_type: random
  target_has_input: false
  shuffle_input_prob: 0.0
  reverse_input_prob: 0.5
  square_crop: true
  scene_scale: 1.0
  seed: 777
  resize_h: 224
  resize_w: 224
training:
  grad_checkpoint_every: 1
  num_views:
  - 6
  - 12
  - 24
  - 32
  target_views:
  - 6
  - 6
  - 6
  - 1
  batch_size_per_gpu:
  - 4
  - 2
  - 1
  - 1
  res_dict:
  - - 224
    - 224
  - - 224
    - 224
  - - 224
    - 224
  - - 224
    - 224
inference:
  if_inference: true
  ckpt_path: pretrained_weights/2Xplat/2xplat_patchwise_offset_dl3dv_lr_novdo.pt
  camera_mode: pred_pose_pred_intr
  pose_optimization: false
train:
  seed: 1
  num_steps: 10000
  lr: 2.0e-05
  warmup_steps: 200
  lr_schedule: cosine
  lr_decay_ratio: 0.2
  resume: true
  init_refiner_ckpt: ../FineSplat_exp_final/train/finesplat_224_stage2/refiner_last.pt
  out_dir: ../FineSplat_e2e_ckpt/finesplat_224_e2e
  keep_step_checkpoints: false
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.05
  grad_clip: 1.0
  photometric: mse
  perceptual_weight: 0.2
  lpips_weight: 0.0
  amp_dtype: bf16
  num_workers: 4
  log_every: 100
  image_every: 250
  ckpt_every: 1000
  save_watchlist_renders: false
  run: finesplat_224_e2e
  wandb:
    project: FineSplat
    name: finesplat_224_e2e
    api_key_path: src/configs/api_keys.yaml
watchlist:
  test_data_path: src/data/dl3dv_test.txt
  test_json_paths:
    '6': src/data/dl3dv_start_0_distance_50_ctx_6v_tgt_8v.json
    '12': src/data/dl3dv_start_0_distance_100_ctx_12v_tgt_8v.json
    '24': src/data/dl3dv_start_0_distance_150_ctx_24v_tgt_8v.json
