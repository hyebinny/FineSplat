# Appearance backbone, step 2: fine-tune the step-1 model with the 4x4-patch head and SH degree 1
# (https://github.com/Gynjn/MVP). The pretrained head is converted to the patch layout on load.
# Run from the MVP repository:
#   torchrun --nproc_per_node <num_gpus> train.py --config <this file>
# The released Stage 1 was initialised from the 85k-step checkpoint of this run.

model:
  class_name: model.mvp_offset.MVPModel

  patch_factor: 2
  dim1: 256
  dim2: 512
  dim3: 1024
  num_register_tokens: 4
  head_dim: 64
  inter_multi: 4
  qk_norm: true
  stage1_nlayer: 2
  stage2_nlayer: 4
  stage3_nlayer: 8
  group_size: 2
  patch_size: 4
  gaussians_per_patch: 4
  in_channels: 12

  freeze_prev: false

  gaussians:
    sh_degree: 1
    opacity_degree: 0  # view-independent opacity
    near_plane: 0.01
    far_plane: 1000000.0
    scale_bias: -5.5137
    scale_max: -1.2
    opacity_bias: 4.0
    align_to_pixel: true
    max_dist: 500.0

data:
  data_path: "data/dl3dv_train.txt"
  input_frame_select_type: "uniform"
  json_path: "data/dl3dv_fold_8_kmeans_input_idx.json"
  max_frame_dist: 128
  min_frame_dist: all
  num_input_frames: 32
  num_target_frames: 6
  resize_h: 224
  reverse_input_prob: 0.5
  scene_scale: 1
  seed: 777
  shuffle_input_prob: 0.0
  square_crop: true
  target_frame_select_type: "random"
  target_has_input: true


training:
  resume_ckpt: ./experiments/checkpoints/appearance_backbone_pretrain/ckpt_0000000000120000.pt
  reset_training_state: true
  use_amp: true
  use_tf32: true
  amp_dtype: bf16

  chunk_size: 4

  api_key_path: ./configs/api_keys.yaml
  num_views: [6, 12, 24, 32] # input
  target_views: [6, 6, 8, 4] # output
  batch_size_per_gpu: [32, 16, 8, 8]
  res_dict:
    - [224, 224]
    - [224, 224]
    - [224, 224]
    - [224, 224]
  warmup: 3000
  weight_decay: 0.05
  beta1: 0.9
  beta2: 0.95
  lr: 0.0002
  train_steps: 120000
  train_stage: 1

  dataset_name: dataset.Dataset
  checkpoint_dir: ./experiments/checkpoints/appearance_backbone_finetune
  checkpoint_every: 5000
  grad_accum_steps: 1
  grad_checkpoint_every: 1

  l2_loss_weight: 1.0
  lpips_loss_weight: 0.0
  perceptual_loss_weight: 0.2

  num_threads: 8
  num_workers: 4
  prefetch_factor: 8
  print_every: 20

  wandb_logging: true
  wandb_entity: your_wandb_entity
  wandb_project: your_project
  wandb_group: your_experiment_group
  wandb_exp_name: your_experiment
  wandb_log_every: 50
